
# =========================
# Server
# =========================
server.port=8080

# =========================
# MongoDB
# =========================
# Example: mongodb://user:pass@localhost:27017/app?authSource=admin
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/app}

# =========================
# CORS
# =========================
# Comma-separated origins. Example: http://localhost:3000,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# =========================
# Firebase Admin
# =========================
# Path to service account json (absolute path recommended in production).
# Example: D:/secrets/firebase-service-account.json
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# =========================
# Email (SMTP)
# =========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@example.com}

# =========================
# Cloudinary
# =========================
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================
# Swagger / OpenAPI (springdoc)
# =========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
